<p-dialog [(visible)]="visible" header="Conferma" (onHide)="onNo()" [modal]="true" [style]="{width:'450px'}">
    <ng-template pTemplate="content">
        <div class="flex align-items-center justify-content-center">
            <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
            <span>Sicuro di voler cancellare l'elemento?</span>
        </div>
        <div class="flex justify-content-end mt-3 gap-2">
            <span class="p-buttonset">
                <button pButton pRipple icon="pi pi-times" label="No" (click)="onNo()"></button>
                <button pButton pRipple icon="pi pi-check" label="Si" (click)="onYes()"></button>
            </span>
        </div>
    </ng-template>
</p-dialog>

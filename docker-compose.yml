version: '3.9'

services:
  vidia-gestionale:
    container_name: template
    image: template
    restart: always
    ports:
      - "7000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: jdbc:postgresql://postgres:5432/template
      SERVER_PORT: 9000
    networks:
      - postgres_network

networks:
  postgres_network:
    external: true